root = "."
# Thư mục riêng: clean_on_exit không xoá binary của app
tmp_dir = "tmp/worker"

[build]
  cmd = "go build -o ./tmp/worker/worker ./cmd/worker"
  entrypoint = ["./tmp/worker/worker"]
  include_ext = ["go", "sql", "html", "tmpl"]
  exclude_dir = ["tmp", "deploy", "vendor", ".git"]
  exclude_regex = ["_test\\.go$"]
  poll = true
  poll_interval = 500
  # Gộp các thay đổi dồn dập (sqlc/oapi-codegen ghi nhiều file một lúc) thành một lần build;
  # 300ms từng làm Air chạy chồng nhiều worker cùng lúc (bản cũ còn sống, nhận job)
  delay = 1500
  send_interrupt = true
  kill_delay = "3s"
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
