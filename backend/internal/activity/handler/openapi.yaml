# API của module activity. Sửa spec trước, rồi `make generate` để sinh api/api.gen.go.
# operationId đặt trùng tên method của service, JSON dùng snake_case.
#
# Endpoint dự kiến (M2):
#   GET /history/{entityType}/{entityID}
openapi: 3.0.3
info:
  title: Activity API
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
