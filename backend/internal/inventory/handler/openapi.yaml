# API của module inventory. Sửa spec trước, rồi `make generate` để sinh api/api.gen.go.
# operationId đặt trùng tên method của service, JSON dùng snake_case.
#
# Sau Sprint 2 (chưa có): mượn/trả, thay thế, cha/con, QR /a/{tag}, import/export Excel.
openapi: 3.0.3
info:
  title: Inventory API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /asset-types:
    get:
      operationId: listAssetTypes
      summary: List asset types (inventory.asset.read)
      parameters:
        - $ref: '#/components/parameters/IncludeArchived'
        - name: with_counts
          in: query
          description: >
            Add `asset_count` and `kind_counts` (assets not retired), `attribute_count` and
            `attribute_labels` (active attributes in display order) to each type.
          schema: { type: boolean }
      responses:
        "200":
          description: Asset types without attributes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AssetType' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createAssetType
      summary: Create an asset type, optionally with attributes (inventory.type.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssetTypeRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetTypeDetail' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-types/{typeID}:
    parameters:
      - $ref: '#/components/parameters/TypeID'
    get:
      operationId: getAssetType
      summary: Get an asset type with its attributes and options (inventory.asset.read)
      responses:
        "200":
          description: Asset type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetTypeDetail' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateAssetType
      summary: Rename or describe an asset type (inventory.type.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAssetTypeRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetTypeDetail' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-types/{typeID}/archive:
    parameters:
      - $ref: '#/components/parameters/TypeID'
    post:
      operationId: archiveAssetType
      summary: Stop offering an asset type for new assets (inventory.type.manage)
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetTypeDetail' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-types/{typeID}/restore:
    parameters:
      - $ref: '#/components/parameters/TypeID'
    post:
      operationId: restoreAssetType
      summary: Offer an archived asset type again (inventory.type.manage)
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetTypeDetail' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-types/{typeID}/attributes:
    parameters:
      - $ref: '#/components/parameters/TypeID'
    post:
      operationId: addAttribute
      summary: Add a custom attribute (inventory.type.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewAttribute' }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attribute' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-types/{typeID}/attributes/order:
    put:
      operationId: reorderAttributes
      summary: Put the type's active attributes in a new order, in one change (inventory.type.manage)
      parameters:
        - $ref: '#/components/parameters/TypeID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        "200":
          description: The type with its attributes in the new order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetTypeDetail' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-types/{typeID}/attributes/{attributeID}/options/order:
    put:
      operationId: reorderOptions
      summary: Put a select attribute's active options in a new order, in one change (inventory.type.manage)
      parameters:
        - $ref: '#/components/parameters/TypeID'
        - $ref: '#/components/parameters/AttributeID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        "200":
          description: The attribute with its options in the new order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attribute' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-types/{typeID}/attributes/{attributeID}:
    parameters:
      - $ref: '#/components/parameters/TypeID'
      - $ref: '#/components/parameters/AttributeID'
    patch:
      operationId: updateAttribute
      summary: Change label, unit, data type, required or position (inventory.type.manage)
      description: Data type and unit can change only while no asset has a value; send "unit":"" to remove the unit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAttributeRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attribute' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeAttribute
      summary: Remove a custom attribute; stored values are kept (inventory.type.manage)
      responses:
        "204": { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /asset-types/{typeID}/attributes/{attributeID}/restore:
    parameters:
      - $ref: '#/components/parameters/TypeID'
      - $ref: '#/components/parameters/AttributeID'
    post:
      operationId: restoreAttribute
      summary: Undo removing an attribute (inventory.type.manage)
      responses:
        "200":
          description: Restored attribute
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attribute' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-types/{typeID}/attributes/{attributeID}/options:
    parameters:
      - $ref: '#/components/parameters/TypeID'
      - $ref: '#/components/parameters/AttributeID'
    post:
      operationId: addOption
      summary: Add an option to a select attribute (inventory.type.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptionRequest' }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Option' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-types/{typeID}/attributes/{attributeID}/options/{optionID}:
    parameters:
      - $ref: '#/components/parameters/TypeID'
      - $ref: '#/components/parameters/AttributeID'
      - $ref: '#/components/parameters/OptionID'
    patch:
      operationId: updateOption
      summary: Rename or move an option (inventory.type.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOptionRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Option' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeOption
      summary: Remove an option; assets using it keep it (inventory.type.manage)
      responses:
        "204": { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /asset-types/{typeID}/attributes/{attributeID}/options/{optionID}/restore:
    parameters:
      - $ref: '#/components/parameters/TypeID'
      - $ref: '#/components/parameters/AttributeID'
      - $ref: '#/components/parameters/OptionID'
    post:
      operationId: restoreOption
      summary: Undo removing an option (inventory.type.manage)
      responses:
        "200":
          description: Restored option
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Option' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-statuses:
    get:
      operationId: listStatuses
      summary: List asset statuses (inventory.asset.read)
      parameters:
        - $ref: '#/components/parameters/IncludeArchived'
        - name: with_counts
          in: query
          description: Add `asset_count` (assets with this status, retired ones included) to each status.
          schema: { type: boolean }
      responses:
        "200":
          description: Statuses
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Status' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createStatus
      summary: Create a status (inventory.status.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStatusRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-statuses/order:
    put:
      operationId: reorderStatuses
      summary: Put every active status in a new order, in one change (inventory.status.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        "200":
          description: Active statuses in the new order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Status' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-statuses/{statusID}:
    parameters:
      - $ref: '#/components/parameters/StatusID'
    patch:
      operationId: updateStatus
      summary: Rename, move or make default of its kind (inventory.status.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStatusRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-statuses/{statusID}/archive:
    parameters:
      - $ref: '#/components/parameters/StatusID'
    post:
      operationId: archiveStatus
      summary: Stop offering a status (inventory.status.manage)
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        default: { $ref: '#/components/responses/Problem' }

  /asset-statuses/{statusID}/restore:
    parameters:
      - $ref: '#/components/parameters/StatusID'
    post:
      operationId: restoreStatus
      summary: Offer an archived status again (inventory.status.manage)
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        default: { $ref: '#/components/responses/Problem' }

  /assets:
    get:
      operationId: listAssets
      summary: Browse, search and filter assets (inventory.asset.read)
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of tag or name
          schema: { type: string, maxLength: 200 }
        - name: type_id
          in: query
          description: Lọc theo loại; khi có, mỗi dòng kèm `attributes` (các cột của loại).
          schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        - name: status_id
          in: query
          schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        - name: status_kind
          in: query
          schema: { $ref: '#/components/schemas/StatusKind' }
        - name: location_id
          in: query
          schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        - name: holder_member_id
          in: query
          schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        - name: include_retired
          in: query
          schema: { type: boolean }
        - name: borrowable
          in: query
          description: Chỉ tài sản cho mượn được ngay (loại bật can_borrow, status thuộc kind available).
          schema: { type: boolean }
        - name: attr
          in: query
          description: |
            Lọc theo thuộc tính tuỳ chỉnh, cần `type_id`; lặp lại để kết hợp (AND).
            Dạng `<key>:<op>:<value>`. Toán tử theo kiểu: text `eq` (không phân biệt
            hoa thường), `contains`; number và date `eq`, `gt`, `gte`, `lt`, `lte`;
            boolean `eq` (`true`/`false`); select `eq` (id option), `in` (id ngăn
            bằng dấu phẩy). Ví dụ `attr=ram_gb:gte:16&attr=os:eq:<option id>`.
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              pattern: '^[a-z][a-z0-9_]{0,31}:(eq|gt|gte|lt|lte|contains|in):.+$'
        - name: field
          in: query
          description: |
            Lọc theo trường có sẵn của mọi tài sản, không cần `type_id`; lặp lại để kết hợp
            (AND). Dạng `<field>:<op>:<value>`: `purchase_date`, `created_at`, `updated_at`
            với `eq`, `gt`, `gte`, `lt`, `lte` và ngày `YYYY-MM-DD` (created_at/updated_at so
            theo ngày của `tz`); `description` với `contains`. Ví dụ
            `field=purchase_date:gte:2026-01-01`.
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              pattern: '^(purchase_date|created_at|updated_at|description):(eq|gt|gte|lt|lte|contains):.+$'
        - name: tz
          in: query
          description: Múi giờ IANA của người dùng (Asia/Ho_Chi_Minh) để so created_at/updated_at theo ngày; rỗng là UTC.
          schema: { type: string, maxLength: 64 }
        - name: sort
          in: query
          description: |
            `tag`, `name`, `purchase_date`, `updated_at`, `asset_type` (tên loại),
            `status` (thứ tự status như `GET /asset-statuses`) hoặc `attributes.<key>`
            (cần `type_id`; tài sản không có giá trị ở cuối); tiền tố `-` là giảm dần.
            Mặc định `tag`.
          schema:
            type: string
            pattern: '^-?(tag|name|purchase_date|updated_at|asset_type|status|attributes\.[a-z][a-z0-9_]{0,31})$'
        - $ref: '../../../api/common.yaml#/components/parameters/Page'
        - $ref: '../../../api/common.yaml#/components/parameters/PageSize'
      responses:
        "200":
          description: Page of assets; with type_id each item also carries its attribute values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createAsset
      summary: Create an asset (inventory.asset.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssetRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDetail' }
        default: { $ref: '#/components/responses/Problem' }

  /assets/export:
    post:
      operationId: exportAssets
      summary: Download assets as .xlsx (inventory.asset.read and inventory.asset.export)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        "200":
          description: The workbook
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Export-Skipped-Columns:
              description: Attribute keys in the layout that no exported type has, comma-separated
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }

  /export-profiles:
    get:
      operationId: listExportProfiles
      summary: Your export profiles and every shared one (inventory.asset.export)
      responses:
        "200":
          description: Profiles by name
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExportProfile' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createExportProfile
      summary: Save a report layout (inventory.asset.export)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExportProfileRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportProfile' }
        default: { $ref: '#/components/responses/Problem' }

  /export-profiles/{profileID}:
    parameters:
      - name: profileID
        in: path
        required: true
        schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
    get:
      operationId: getExportProfile
      summary: One profile (yours or shared)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportProfile' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateExportProfile
      summary: Rename, share or change the layout (owner; shared ones also inventory.export_profile.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateExportProfileRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportProfile' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteExportProfile
      summary: Delete a profile (owner; shared ones also inventory.export_profile.manage)
      responses:
        "204": { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /export-profiles/{profileID}/restore:
    parameters:
      - name: profileID
        in: path
        required: true
        schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
    post:
      operationId: restoreExportProfile
      summary: Undo deleting a profile (owner; shared ones also inventory.export_profile.manage)
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportProfile' }
        default: { $ref: '#/components/responses/Problem' }

  /assets/{assetID}:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    get:
      operationId: getAsset
      summary: Get an asset with its custom attributes (inventory.asset.read)
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDetail' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateAsset
      summary: Replace an asset's fields and attribute values (inventory.asset.manage)
      description: Full replacement. Omitted optional fields and attributes are cleared; status_id omitted keeps the current status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAssetRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDetail' }
        default: { $ref: '#/components/responses/Problem' }

  # Hàng loạt: mỗi tài sản thành công hay thất bại riêng; luôn 200 với kết quả từng cái
  /assets/bulk-retire:
    post:
      operationId: retireAssets
      summary: Retire several assets; each succeeds or fails on its own (inventory.asset.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkRetireRequest' }
      responses:
        "200":
          description: Which assets were retired and which were not, with the reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        default: { $ref: '#/components/responses/Problem' }

  /assets/bulk-status:
    post:
      operationId: setAssetsStatus
      summary: Change the status of several assets; each succeeds or fails on its own (inventory.asset.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkStatusRequest' }
      responses:
        "200":
          description: Which assets changed and which did not, with the reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        default: { $ref: '#/components/responses/Problem' }

  /assets/{assetID}/retire:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    post:
      operationId: retireAsset
      summary: Retire an asset; it keeps its tag (inventory.asset.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetireAssetRequest' }
      responses:
        "200":
          description: Retired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDetail' }
        default: { $ref: '#/components/responses/Problem' }

  /assets/{assetID}/restore:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    post:
      operationId: restoreAsset
      summary: Restore a retired asset to the default available status (inventory.asset.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDetail' }
        default: { $ref: '#/components/responses/Problem' }

  /assets/{assetID}/activity:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    get:
      operationId: getAssetActivity
      summary: Activity history of an asset, newest first (inventory.asset.read)
      description: |
        Lịch sử hoạt động đọc từ event đã lưu (tạo, sửa, retire, khôi phục). Tên status, loại,
        nhãn thuộc tính và option đã được đổi sẵn thành chữ. Thay đổi chỗ để và người giữ
        không hiện. Phân trang bằng con trỏ: truyền `next` của trang trước vào `before`.
      parameters:
        - name: before
          in: query
          description: ID of the last entry of the previous page (`next`)
          schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        - name: limit
          in: query
          description: Entries per page, default 50
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: One page of activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetActivityPage' }
        default: { $ref: '#/components/responses/Problem' }
  /assets/{assetID}/replacement:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    post:
      operationId: recordReplacement
      summary: Record that another asset replaces this one; this asset is retired (inventory.asset.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplacementRequest' }
      responses:
        "200":
          description: The replaced (old) asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDetail' }
        default: { $ref: '#/components/responses/Problem' }

  /assets/{assetID}/replacement/undo:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    post:
      operationId: undoReplacement
      summary: Undo this asset's replacement and restore it (inventory.asset.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        "200":
          description: The restored asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDetail' }
        default: { $ref: '#/components/responses/Problem' }
  # Mượn tài sản (US-10): quyền kiểm ở service (request: phiếu của mình; manage: mọi phiếu)
  /borrow-tickets:
    get:
      operationId: listBorrowTickets
      summary: Borrow tickets; without inventory.borrow.manage only your own
      parameters:
        - name: state
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 5
            items: { $ref: '#/components/schemas/TicketState' }
        - name: mine
          in: query
          description: Only my own tickets (managers see everyone's otherwise)
          schema: { type: boolean }
        - name: q
          in: query
          description: Requester name or email, or asset type name
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          schema: { type: string, enum: [number, -number, needed_from, -needed_from] }
        - $ref: '../../../api/common.yaml#/components/parameters/Page'
        - $ref: '../../../api/common.yaml#/components/parameters/PageSize'
      responses:
        "200":
          description: One page of tickets, newest first by default
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BorrowTicketPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createBorrowTicket
      summary: Ask to borrow an asset of a type (inventory.borrow.request)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBorrowTicketRequest' }
      responses:
        "201":
          description: The new ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BorrowTicket' }
        default: { $ref: '#/components/responses/Problem' }

  /borrow-tickets/summary:
    get:
      operationId: borrowTicketSummary
      summary: Tickets waiting and approved, for the sidebar (inventory.borrow.manage)
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BorrowTicketSummary' }
        default: { $ref: '#/components/responses/Problem' }

  /borrow-tickets/{ticketID}:
    parameters:
      - $ref: '#/components/parameters/TicketID'
    get:
      operationId: getBorrowTicket
      summary: One ticket; someone else's is 404 without inventory.borrow.manage
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BorrowTicket' }
        default: { $ref: '#/components/responses/Problem' }

  /borrow-tickets/{ticketID}/approve:
    parameters:
      - $ref: '#/components/parameters/TicketID'
    post:
      operationId: approveBorrowTicket
      summary: Approve a waiting ticket by reserving an available asset of its type (inventory.borrow.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveTicketRequest' }
      responses:
        "200":
          description: The approved ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BorrowTicket' }
        default: { $ref: '#/components/responses/Problem' }

  /borrow-tickets/{ticketID}/reject:
    parameters:
      - $ref: '#/components/parameters/TicketID'
    post:
      operationId: rejectBorrowTicket
      summary: Reject a waiting ticket with a reason (inventory.borrow.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectTicketRequest' }
      responses:
        "200":
          description: The rejected ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BorrowTicket' }
        default: { $ref: '#/components/responses/Problem' }

  /borrow-tickets/{ticketID}/cancel:
    parameters:
      - $ref: '#/components/parameters/TicketID'
    post:
      operationId: cancelBorrowTicket
      summary: Cancel your own ticket (waiting or approved), or as a manager an approved one; frees the reserved asset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTicketRequest' }
      responses:
        "200":
          description: The cancelled ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BorrowTicket' }
        default: { $ref: '#/components/responses/Problem' }

  /borrow-tickets/{ticketID}/hand-over:
    parameters:
      - $ref: '#/components/parameters/TicketID'
    post:
      operationId: handOverBorrowTicket
      summary: Hand the reserved asset over; the loan starts today (inventory.borrow.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        "200":
          description: The handed-over ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BorrowTicket' }
        default: { $ref: '#/components/responses/Problem' }

  /assets/{assetID}/lend:
    parameters:
      - $ref: '#/components/parameters/AssetID'
    post:
      operationId: lendAsset
      summary: Lend an available asset directly, without a ticket (inventory.borrow.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LendRequest' }
      responses:
        "200":
          description: The asset, now on loan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDetail' }
        default: { $ref: '#/components/responses/Problem' }

  /loans:
    get:
      operationId: listLoans
      summary: Assets on loan now, overdue first (inventory.borrow.manage)
      parameters:
        - $ref: '../../../api/common.yaml#/components/parameters/Page'
        - $ref: '../../../api/common.yaml#/components/parameters/PageSize'
      responses:
        "200":
          description: One page of active loans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanPage' }
        default: { $ref: '#/components/responses/Problem' }

  /borrowers:
    get:
      operationId: searchBorrowers
      summary: Active accounts to lend to, by name or email (inventory.borrow.manage)
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Up to 10 accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BorrowerList' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TypeID:
      name: typeID
      in: path
      required: true
      schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
    AttributeID:
      name: attributeID
      in: path
      required: true
      schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
    OptionID:
      name: optionID
      in: path
      required: true
      schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
    StatusID:
      name: statusID
      in: path
      required: true
      schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
    AssetID:
      name: assetID
      in: path
      required: true
      schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
    TicketID:
      name: ticketID
      in: path
      required: true
      schema: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
    IncludeArchived:
      name: include_archived
      in: query
      schema: { type: boolean }

  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: '../../../api/common.yaml#/components/schemas/Problem' }

  schemas:
    DataType:
      type: string
      enum: [text, number, date, boolean, select]

    StatusKind:
      type: string
      enum: [available, in_use, unavailable, retired]

    AssetType:
      type: object
      required: [id, code, name, description, is_system, can_borrow, version, created_at, updated_at]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean }
        can_borrow: { type: boolean, description: '"Can be borrowed": assets of this type can be lent (US-10)' }
        archived_at: { type: string, format: date-time }
        version: { type: integer, format: int32 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        asset_count:
          type: integer
          format: int64
          description: Assets of this type that are not retired; only with `with_counts=true`
        kind_counts: { $ref: '#/components/schemas/KindCounts' }
        attribute_count:
          type: integer
          format: int32
          description: Active attributes; only with `with_counts=true`
        attribute_labels:
          type: array
          description: Labels of the active attributes in display order; only with `with_counts=true`
          items: { type: string }

    KindCounts:
      type: object
      description: Assets not retired by the kind of their status; only with `with_counts=true`
      required: [available, in_use, unavailable]
      properties:
        available: { type: integer, format: int64 }
        in_use: { type: integer, format: int64 }
        unavailable: { type: integer, format: int64 }

    AssetTypeDetail:
      allOf:
        - $ref: '#/components/schemas/AssetType'
        - type: object
          required: [attributes]
          properties:
            attributes:
              type: array
              description: All attributes in display order, including removed ones (removed = true)
              items: { $ref: '#/components/schemas/Attribute' }

    Attribute:
      type: object
      required: [id, key, label, data_type, is_required, position, removed, options]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        key: { type: string }
        label: { type: string }
        data_type: { $ref: '#/components/schemas/DataType' }
        unit: { type: string, description: Only for number attributes }
        is_required: { type: boolean }
        position: { type: integer, format: int32 }
        removed: { type: boolean }
        options:
          type: array
          items: { $ref: '#/components/schemas/Option' }

    Option:
      type: object
      required: [id, label, position, removed]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        label: { type: string }
        position: { type: integer, format: int32 }
        removed: { type: boolean }

    NewAttribute:
      type: object
      required: [key, label, data_type]
      properties:
        key: { type: string, minLength: 1, maxLength: 32 }
        label: { type: string, minLength: 1, maxLength: 100 }
        data_type: { $ref: '#/components/schemas/DataType' }
        unit: { type: string, maxLength: 16 }
        is_required: { type: boolean }
        position: { type: integer, format: int32, minimum: 0, maximum: 10000 }
        options:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 100 }

    CreateAssetTypeRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        can_borrow: { type: boolean, description: Default false }
        attributes:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/NewAttribute' }

    UpdateAssetTypeRequest:
      type: object
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        can_borrow: { type: boolean }
        version: { type: integer, format: int32 }

    UpdateAttributeRequest:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        unit: { type: string, maxLength: 16, description: '"" removes the unit' }
        data_type: { $ref: '#/components/schemas/DataType' }
        is_required: { type: boolean }
        position: { type: integer, format: int32, minimum: 0, maximum: 10000 }

    OrderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          description: Every active attribute (or option) exactly once, in the new order
          type: array
          maxItems: 500
          items: { $ref: '../../../api/common.yaml#/components/schemas/ID' }

    OptionRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        position: { type: integer, format: int32, minimum: 0, maximum: 10000 }

    UpdateOptionRequest:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        position: { type: integer, format: int32, minimum: 0, maximum: 10000 }

    Status:
      type: object
      required: [id, name, kind, is_default, is_system, position]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/StatusKind' }
        is_default: { type: boolean }
        is_system: { type: boolean }
        position: { type: integer, format: int32 }
        archived_at: { type: string, format: date-time }
        asset_count:
          type: integer
          format: int64
          description: Assets with this status, retired ones included; only with `with_counts=true`

    CreateStatusRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/StatusKind' }
        position: { type: integer, format: int32, minimum: 0, maximum: 10000 }

    UpdateStatusRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        position: { type: integer, format: int32, minimum: 0, maximum: 10000 }
        make_default:
          type: boolean
          description: Make this the default status of its kind (moves the flag)

    AssetActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssetActivityEntry' }
        next: { $ref: '../../../api/common.yaml#/components/schemas/ID' }

    AssetActivityEntry:
      type: object
      required: [id, kind, type, occurred_at, actor, changes]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        kind: { type: string, enum: [created, updated, retired, restored, replaced, replaces, replacement_undone, reserved, reservation_cancelled, lent, other] }
        type: { type: string, description: Raw event type }
        occurred_at: { type: string, format: date-time }
        actor:
          nullable: true
          description: null when the system did it
          allOf: [{ $ref: '#/components/schemas/ActivityActor' }]
        changes:
          type: array
          items: { $ref: '#/components/schemas/ActivityChange' }
        reason: { type: string, description: 'On retired and replaced, when one was given' }
        related: { $ref: '#/components/schemas/ActivityRelated' }
        person:
          nullable: true
          description: 'On reserved, reservation_cancelled and lent: who it was reserved for or lent to'
          allOf: [{ $ref: '#/components/schemas/ActivityActor' }]
        ticket_number: { type: integer, format: int64, description: Borrow ticket number; 0 for a direct loan }
        return_by: { type: string, format: date, nullable: true }

    ActivityRelated:
      type: object
      description: The asset at the other end of a replacement (US-13)
      required: [id, tag]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        tag: { type: string }
        role: { type: string, enum: [old, new], description: "Only on replacement_undone: this asset's role" }

    ActivityActor:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        name: { type: string, description: '"Unknown user" when the account no longer exists' }

    ActivityChange:
      type: object
      required: [field, label, from, to]
      properties:
        field: { type: string }
        label: { type: string }
        from: { type: string, nullable: true }
        to: { type: string, nullable: true }

    AssetListItem:
      type: object
      required: [id, tag, name, asset_type_id, asset_type_name, status_id, status_name, status_kind, version, updated_at]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        tag: { type: string }
        name: { type: string }
        asset_type_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        asset_type_name: { type: string }
        status_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        status_name: { type: string }
        status_kind: { $ref: '#/components/schemas/StatusKind' }
        location_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        holder_member_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        purchase_date: { type: string, format: date }
        retired_at: { type: string, format: date-time }
        version: { type: integer, format: int32 }
        updated_at: { type: string, format: date-time }
        attributes:
          description: Chỉ có khi lọc theo `type_id`; như trong chi tiết tài sản.
          type: array
          items: { $ref: '#/components/schemas/AttributeValue' }

    AssetList:
      allOf:
        - $ref: '../../../api/common.yaml#/components/schemas/Paged'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AssetListItem' }

    TypeSummary:
      type: object
      required: [id, code, name]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        code: { type: string }
        name: { type: string }

    StatusSummary:
      type: object
      required: [id, name, kind]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/StatusKind' }

    AttributeValue:
      type: object
      required: [key, label, data_type, value]
      properties:
        key: { type: string }
        label: { type: string }
        data_type: { $ref: '#/components/schemas/DataType' }
        unit: { type: string }
        value:
          nullable: true
          description: string (text, date YYYY-MM-DD, select option id), number or boolean; null when empty
        option_label: { type: string }
        option_removed: { type: boolean }

    ReplacementRequest:
      type: object
      required: [replacement_asset_id, replaced_on, reason, version]
      properties:
        replacement_asset_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        replaced_on: { type: string, format: date }
        reason: { type: string, maxLength: 500 }
        version: { type: integer, format: int32 }

    ReplacementLink:
      type: object
      required: [id, tag, name, replaced_on, reason]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        tag: { type: string }
        name: { type: string }
        replaced_on: { type: string, format: date }
        reason: { type: string }

    TicketState:
      type: string
      enum: [waiting, approved, rejected, cancelled, handed_over]

    Person:
      type: object
      required: [id, name, email]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        name: { type: string }
        email: { type: string }

    AssetRef:
      type: object
      required: [id, tag, name]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        tag: { type: string }
        name: { type: string }

    BorrowTicket:
      type: object
      required: [id, number, state, requester, asset_type, requirements, needed_from, note, reason, version, created_at, updated_at]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        number: { type: integer, format: int64 }
        state: { $ref: '#/components/schemas/TicketState' }
        requester: { $ref: '#/components/schemas/Person' }
        asset_type:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
            name: { type: string }
        requirements:
          type: array
          description: Attribute conditions "<key>:<op>:<value>", as in the asset list's attr filter
          items: { type: string }
        suggested_asset:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/AssetRef' }]
        asset:
          nullable: true
          description: The reserved asset, once approved
          allOf: [{ $ref: '#/components/schemas/AssetRef' }]
        needed_from: { type: string, format: date }
        return_by: { type: string, format: date, nullable: true }
        note: { type: string }
        reason: { type: string, description: Why it was rejected or cancelled }
        decided_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        version: { type: integer, format: int32 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BorrowTicketPage:
      allOf:
        - $ref: '../../../api/common.yaml#/components/schemas/Paged'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/BorrowTicket' }

    BorrowTicketSummary:
      type: object
      required: [waiting, approved]
      properties:
        waiting: { type: integer, format: int64 }
        approved: { type: integer, format: int64 }

    CreateBorrowTicketRequest:
      type: object
      required: [asset_type_id, needed_from]
      properties:
        asset_type_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        requirements:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 600 }
        suggested_asset_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        needed_from: { type: string, format: date }
        return_by: { type: string, format: date }
        note: { type: string, maxLength: 500 }

    ApproveTicketRequest:
      type: object
      required: [asset_id, version]
      properties:
        asset_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        version: { type: integer, format: int32 }

    RejectTicketRequest:
      type: object
      required: [reason, version]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        version: { type: integer, format: int32 }

    CancelTicketRequest:
      type: object
      required: [version]
      properties:
        reason: { type: string, maxLength: 500 }
        version: { type: integer, format: int32 }

    LendRequest:
      type: object
      required: [borrower_id, version]
      properties:
        borrower_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        return_by: { type: string, format: date }
        version: { type: integer, format: int32 }

    Loan:
      type: object
      required: [id, asset, asset_type_name, borrower, started_on, ticket_number, overdue_days]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        asset: { $ref: '#/components/schemas/AssetRef' }
        asset_type_name: { type: string }
        borrower: { $ref: '#/components/schemas/Person' }
        ticket_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        ticket_number: { type: integer, format: int64, description: 0 for a direct loan }
        started_on: { type: string, format: date }
        return_by: { type: string, format: date, nullable: true }
        overdue_days: { type: integer, description: 0 when not overdue }

    LoanPage:
      allOf:
        - $ref: '../../../api/common.yaml#/components/schemas/Paged'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Loan' }

    BorrowerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Person' }

    AssetBorrowing:
      type: object
      required: [state, account, overdue_days]
      properties:
        state: { type: string, enum: [reserved, on_loan] }
        account:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
            name: { type: string }
        ticket:
          nullable: true
          type: object
          required: [id, number]
          properties:
            id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
            number: { type: integer, format: int64 }
        since: { type: string, format: date, nullable: true }
        return_by: { type: string, format: date, nullable: true }
        overdue_days: { type: integer }

    AssetDetail:
      type: object
      required: [id, tag, name, description, asset_type, status, version, created_at, updated_at, attributes, replaces]
      properties:
        replaced_by:
          nullable: true
          description: The asset that replaced this one (US-13)
          allOf: [{ $ref: '#/components/schemas/ReplacementLink' }]
        replaces:
          type: array
          description: Assets this one replaced, newest first
          items: { $ref: '#/components/schemas/ReplacementLink' }
        borrowing:
          nullable: true
          description: Reserved for someone, or on loan (US-10)
          allOf: [{ $ref: '#/components/schemas/AssetBorrowing' }]
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        tag: { type: string }
        name: { type: string }
        description: { type: string }
        asset_type: { $ref: '#/components/schemas/TypeSummary' }
        status: { $ref: '#/components/schemas/StatusSummary' }
        location_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        holder_member_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        purchase_date: { type: string, format: date }
        retired_at: { type: string, format: date-time }
        retired_reason: { type: string }
        version: { type: integer, format: int32 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        attributes:
          type: array
          description: Active attributes of the asset's type in display order, with their values
          items: { $ref: '#/components/schemas/AttributeValue' }

    CreateAssetRequest:
      type: object
      required: [tag, name, asset_type_id]
      properties:
        tag: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        asset_type_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        status_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        location_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        holder_member_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        purchase_date: { type: string, format: date }
        attributes: { $ref: '#/components/schemas/AttributeValues' }

    UpdateAssetRequest:
      type: object
      required: [name, asset_type_id, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        asset_type_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        status_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        location_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        holder_member_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        purchase_date: { type: string, format: date }
        attributes: { $ref: '#/components/schemas/AttributeValues' }
        version: { type: integer, format: int32 }

    AttributeValues:
      type: object
      description: Attribute key -> value (string, number, boolean; select = option id; date = YYYY-MM-DD)
      maxProperties: 100
      additionalProperties: true

    BulkItem:
      type: object
      required: [id, version]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        version:
          type: integer
          format: int32
          description: The version you last read; a newer one fails that asset with asset-changed

    BulkItems:
      type: array
      minItems: 1
      maxItems: 200
      items: { $ref: '#/components/schemas/BulkItem' }

    BulkRetireRequest:
      type: object
      required: [items]
      properties:
        items: { $ref: '#/components/schemas/BulkItems' }
        reason: { type: string, maxLength: 500 }

    BulkStatusRequest:
      type: object
      required: [items, status_id]
      properties:
        items: { $ref: '#/components/schemas/BulkItems' }
        status_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }

    BulkResult:
      type: object
      required: [succeeded, failed]
      properties:
        succeeded:
          type: array
          items: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        failed:
          type: array
          items: { $ref: '#/components/schemas/BulkFailure' }

    BulkFailure:
      type: object
      required: [id, problem]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        problem: { $ref: '../../../api/common.yaml#/components/schemas/Problem' }

    RetireAssetRequest:
      type: object
      required: [version]
      properties:
        reason: { type: string, maxLength: 500 }
        version: { type: integer, format: int32 }

    VersionRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int32 }

    ExportColumn:
      type: object
      required: [field]
      properties:
        field: { type: string, maxLength: 40, description: 'tag, name, description, type, status, purchase_date, updated_at or attr:<key>' }
        header: { type: string, maxLength: 100 }
        width: { type: number, minimum: 0, maximum: 80 }

    ExportLayout:
      type: object
      required: [columns, sheets, sheet_name, title_row, summary, header, freeze, filter, stripes, date_format, bool_style, status_as, unit_in]
      properties:
        columns:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/ExportColumn' }
        sheets: { type: string, enum: [single, per_type] }
        each_type_attrs: { type: boolean }
        sheet_name: { type: string, maxLength: 31 }
        title_row: { type: boolean }
        summary: { type: boolean }
        header: { type: string, enum: [plain, bold, bold_fill] }
        freeze: { type: boolean }
        filter: { type: boolean }
        stripes: { type: boolean }
        date_format: { type: string, enum: ['dd/mm/yyyy', 'yyyy-mm-dd', 'd mmm yyyy'] }
        bool_style: { type: string, enum: [yes_no, check] }
        status_as: { type: string, enum: [name, kind] }
        unit_in: { type: string, enum: [header, cell] }
        sort: { type: string, maxLength: 60, description: 'Empty: the request sort' }

    ExportFilters:
      type: object
      description: Same filters and rules as GET /assets, plus ids for "Export selected"
      properties:
        q: { type: string, maxLength: 200 }
        type_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        status_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        status_kind: { $ref: '#/components/schemas/StatusKind' }
        include_retired: { type: boolean }
        attr:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 300 }
        field:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 300 }
        sort: { type: string, maxLength: 60 }
        ids:
          type: array
          maxItems: 200
          items: { $ref: '../../../api/common.yaml#/components/schemas/ID' }

    ExportRequest:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [data, report] }
        filters: { $ref: '#/components/schemas/ExportFilters' }
        profile_id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        layout: { $ref: '#/components/schemas/ExportLayout' }
        tz:
          type: string
          maxLength: 64
          description: IANA time zone of the user (Asia/Ho_Chi_Minh); empty means UTC. Used for updated_at cells, the report title date and the file name.

    ExportProfile:
      type: object
      required: [id, name, shared, layout, owner, can_edit, version, created_at, updated_at]
      properties:
        id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
        name: { type: string }
        shared: { type: boolean }
        layout: { $ref: '#/components/schemas/ExportLayout' }
        owner:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '../../../api/common.yaml#/components/schemas/ID' }
            name: { type: string }
        can_edit: { type: boolean }
        version: { type: integer, format: int32 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateExportProfileRequest:
      type: object
      required: [name, layout]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        shared: { type: boolean }
        layout: { $ref: '#/components/schemas/ExportLayout' }

    UpdateExportProfileRequest:
      type: object
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        shared: { type: boolean }
        layout: { $ref: '#/components/schemas/ExportLayout' }
        version: { type: integer, format: int32 }
