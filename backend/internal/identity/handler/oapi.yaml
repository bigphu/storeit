# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
# Config cho oapi-codegen, chạy qua //go:generate trong handler.go
package: api
output: api/api.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  # GetSwagger() cho web.ValidateRequests (validate request theo spec)
  embedded-spec: true
# Schema dùng chung (lỗi, phân trang, ID) nằm ở package apicommon
import-mapping:
  ../../../api/common.yaml: storeit/internal/platform/web/apicommon
