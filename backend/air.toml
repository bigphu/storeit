root = "."
# Thư mục riêng: clean_on_exit không xoá binary của worker
tmp_dir = "tmp/app"

[build]
  cmd = "go build -o ./tmp/app/server ./cmd/server"
  entrypoint = ["./tmp/app/server"]
  include_ext = ["go", "sql", "html", "tmpl"]
  exclude_dir = ["tmp", "deploy", "vendor", ".git"]
  exclude_regex = ["_test\\.go$"]
  poll = true
  poll_interval = 500
  # Gộp các thay đổi dồn dập (sqlc/oapi-codegen ghi nhiều file một lúc) thành một lần build;
  # 300ms từng làm Air chạy chồng hai tiến trình, một cái mồ côi giữ cổng 8080
  delay = 1500
  send_interrupt = true
  kill_delay = "3s"
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
