version: "2"

overrides:
  go:
    overrides:
      - db_type: "uuid"
        go_type: 
          import: "github.com/google/uuid"
          type  : "UUID"
      - db_type: "uuid"
        nullable: true
        go_type:
          import : "github.com/google/uuid"
          type   : "UUID"
          pointer: true

      - db_type: "timestamptz"
        go_type:
          import: "time"
          type: "Time"
      - db_type: "timestamptz"
        nullable: true
        go_type:
          import: "time"
          type: "Time"
          pointer: true

      - db_type: "inet"
        go_type:
          import: "net/netip"
          type: "Prefix"
      - db_type: "inet"
        nullable: true
        go_type:
          import: "net/netip"
          type: "Prefix"
          pointer: true

      # jsonb giữ nguyên bytes, repository tự decode
      - db_type: "jsonb"
        go_type:
          import: "encoding/json"
          type: "RawMessage"
      - db_type: "jsonb"
        nullable: true
        go_type:
          import: "encoding/json"
          type: "RawMessage"

sql:
  # Schema lấy từ migrations/ (sqlc bỏ qua phần -- +goose Down)
  # M0: platform/events. Block này giữ &go_defaults nên luôn bật
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/platform/events/queries"
    gen:
      go: &go_defaults
        package: "db"
        out: "internal/platform/events/db"
        sql_package: "pgx/v5"
        emit_interface: true
        # [] thay vì nil với param dạng :many
        emit_empty_slices: true
        emit_pointers_for_null_types: true

  # Mở comment block của module khi nó có file .sql đầu tiên,
  # vì sqlc báo lỗi nếu thư mục queries còn trống.

