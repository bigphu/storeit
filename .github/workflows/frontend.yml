# CI của frontend: type-check, test, build; type API phải khớp spec của backend. Gọi từ
# ci.yml (workflow_call)
name: frontend

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check, test, build
        run: npm run check

      # Fail nếu sửa OpenAPI của backend mà chưa chạy npm run gen:api
      - name: API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api || (echo "chạy npm run gen:api rồi commit"; exit 1)

      - name: Production image builds
        run: docker build --target prod .
