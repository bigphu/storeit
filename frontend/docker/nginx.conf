# Một origin cho cả SPA và API: cookie refresh (SameSite=Strict, Path=/api/v1/auth)
# hoạt động, backend không cần CORS. HTTPS do reverse proxy trên host lo.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Phân giải "app" lúc chạy qua DNS của Docker: app khởi động lại (đổi IP) hay
    # chưa lên khi nginx start thì nginx vẫn chạy
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://app:8080;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Nối IP của bên gọi (reverse proxy trên host) vào X-Forwarded-For; app tin
        # dải mạng compose (HTTP_TRUSTED_PROXIES) nên lần ngược ra IP client thật
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 2m;
    }

    # Health của cả chuỗi (nginx -> app) cho giám sát bên ngoài
    location = /healthz {
        proxy_pass $api;
    }

    # File của Vite có hash trong tên (build.assetsDir = static): cache lâu dài.
    # Không dùng /assets/: đó là route của SPA (/assets/123)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Route của SPA (/assets/123, /accept-invite...) đều trả index.html; không cache
    # index.html để bản deploy mới có hiệu lực ngay
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}
