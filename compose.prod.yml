# Production trên 1 server: image đã build sẵn (target prod), không mount source, không Air.
#   cp .env.prod.example .env && sửa STOREIT_IMAGE, STOREIT_WEB_IMAGE
#   sh deploy/scripts/init.sh                 # secrets + cert MỚI cho server (không copy từ dev)
#   docker compose -f compose.prod.yml up -d
#
#   reverse proxy (HTTPS) ──► web (nginx :8080) ──┬── /      → SPA
#                                                 └── /api/* → app (Go :8080) ──► postgres
#
# Tên project khác dev => volume riêng (storeit-prod_pgdata), không đụng dữ liệu dev.
name: storeit-prod

x-timezone: &timezone
  TZ: UTC
  PGTZ: UTC

# Docker giữ log (stdout/stderr) có giới hạn, không đầy ổ đĩa
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Env chung cho mọi binary Go
x-go-env: &go-env
  <<: *timezone
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: ${APP_DB_NAME:-storeit}
  PGUSER: ${APP_DB_USER:-app_user}
  PGPASSWORD_FILE: /run/secrets/pg_app_pw
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /certs/rootCA.pem
  JWT_KEYS_FILE: /run/secrets/jwt_keys
  JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-v1}
  JWT_ISSUER: ${JWT_ISSUER:-storeit}
  # Frontend: link trong thư mời / đặt lại mật khẩu trỏ về đây
  IDENTITY_APP_URL: ${APP_URL:?set APP_URL, ví dụ https://storeit.example.com}
  # Administrator đầu tiên, chỉ dùng khi DB chưa có account nào. Đăng nhập
  # được rồi thì xoá hai biến này khỏi .env
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

# Cùng 1 image cho server / worker / migrate, chỉ khác entrypoint
x-go-prod: &go-prod
  image: ${STOREIT_IMAGE:?set STOREIT_IMAGE, ví dụ registry.example.com/storeit:1.4.0}
  init: true
  environment: *go-env
  secrets: [pg_app_pw, jwt_keys]
  volumes:
    - ./deploy/postgres/certs/rootCA.pem:/certs/rootCA.pem:ro
  # Hardening: FS chỉ đọc, không capability, không leo quyền
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  # Chạy migration rồi thoát; app/worker chỉ start khi migrate thành công
  migrate:
    <<: *go-prod
    entrypoint: ["/app/migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    <<: *go-prod
    environment:
      <<: *go-env
      HTTP_ADDR: ":8080"
      # Reverse proxy trên host đi vào qua gateway của mạng compose (hoặc là một
      # container trong mạng đó): chỉ tin X-Forwarded-For từ dải này. Thiếu nó
      # thì mọi request mang IP gateway, rate limit đăng nhập dùng chung cho
      # cả công ty và phiên ghi sai IP. Proxy phải đặt X-Forwarded-For.
      HTTP_TRUSTED_PROXIES: ${HTTP_TRUSTED_PROXIES:-${APP_NET_SUBNET:-172.30.0.0/24}}
    # Không publish port: chỉ web (nginx) trong mạng compose gọi vào
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # nginx: phục vụ SPA và chuyển /api sang app (một origin cho cookie refresh).
  # Chỉ nghe 127.0.0.1: reverse proxy (Caddy/nginx) trên host lo HTTPS và phải đặt
  # X-Forwarded-For; web nối thêm IP của nó, app tin cả dải mạng compose
  web:
    image: ${STOREIT_WEB_IMAGE:?set STOREIT_WEB_IMAGE, ví dụ registry.example.com/storeit-web:1.4.0}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    depends_on:
      app: { condition: service_started }
    restart: unless-stopped

  # Giao event, gửi thư và chạy job định kỳ (dọn phiên đăng nhập đã chết)
  worker:
    <<: *go-prod
    entrypoint: ["/app/worker"]
    environment:
      <<: *go-env
      # Gửi thư qua Resend, cùng một API key (secret smtp_password) cho hai cách:
      # smtp (mặc định): username là "resend", mật khẩu là API key;
      # resend: gọi HTTPS API (cổng 443), dùng khi nhà cung cấp chặn cổng SMTP.
      # MAIL_FROM phải thuộc domain đã xác thực ở Resend
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM, ví dụ StoreIt <no-reply@storeit.example.com>}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.resend.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-465}
      MAIL_SMTP_TLS: ${MAIL_SMTP_TLS:-tls}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-resend}
      MAIL_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      MAIL_RESEND_API_KEY_FILE: /run/secrets/smtp_password
    secrets: [pg_app_pw, jwt_keys, smtp_password]
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Cho job đang chạy thời gian kết thúc khi deploy/restart
    stop_grace_period: 30s
    restart: unless-stopped

  # Postgres trên cùng server. Dùng DB managed thì xoá service này (+ volume pgdata),
  # đổi PGHOST ở x-go-env và bỏ depends_on postgres của migrate.
  postgres:
    image: postgres:18-alpine
    shm_size: 256mb
    stop_grace_period: 60s
    # Không publish port: chỉ app/worker/migrate trong network compose truy cập được.
    # Cần psql từ ngoài: `docker compose -f compose.prod.yml exec postgres psql ...` hoặc SSH tunnel.
    environment:
      <<: *timezone
      POSTGRES_USER_FILE: /run/secrets/pg_user
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pw
      POSTGRES_DB: postgres
      # Dùng bởi initdb/01-app.sh
      APP_DB_NAME: ${APP_DB_NAME:-storeit}
      APP_DB_USER: ${APP_DB_USER:-app_user}
    secrets: [pg_user, pg_pw, pg_app_pw]
    volumes:
      # PG18+: mount thư mục cha, PGDATA=/var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/certs:/certs-src:ro
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    command:
      - bash
      - -c
      - |
        set -e
        mkdir -p /etc/ssl/pg
        cp /certs-src/server.crt /certs-src/server.key /etc/ssl/pg/
        chown postgres:postgres /etc/ssl/pg/server.crt /etc/ssl/pg/server.key
        chmod 600 /etc/ssl/pg/server.key
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_min_protocol_version=TLSv1.2 \
          -c ssl_cert_file=/etc/ssl/pg/server.crt \
          -c ssl_key_file=/etc/ssl/pg/server.key \
          -c log_min_duration_statement=500 \
          -c log_connections=on \
          -c log_disconnections=on \
          -c shared_preload_libraries=pg_stat_statements \
          -c pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$(cat /run/secrets/pg_user)\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    logging: *logging
    restart: unless-stopped

# Secret dạng file = bind mount: container đọc bằng uid của nó (app: 65532, postgres: 70),
# nên file phải có quyền đọc (644). Bảo vệ bằng thư mục cha trên host: chmod 700.
secrets:
  pg_user:
    file: ./deploy/postgres/secrets/pg_user.txt
  pg_pw:
    file: ./deploy/postgres/secrets/pg_pw.txt
  pg_app_pw:
    file: ./deploy/postgres/secrets/pg_app_pw.txt
  jwt_keys:
    file: ./deploy/app/secrets/jwt_keys.txt
  # API key của Resend (quyền "Sending access"), một dòng. make init / init.sh
  # tạo file rỗng; dán key vào trước khi chạy worker
  smtp_password:
    file: ./deploy/app/secrets/smtp_password.txt

# Dải mạng cố định để HTTP_TRUSTED_PROXIES biết trước địa chỉ gateway. Trùng dải
# với mạng khác trên server thì đổi APP_NET_SUBNET trong .env
networks:
  default:
    ipam:
      config:
        - subnet: ${APP_NET_SUBNET:-172.30.0.0/24}

volumes:
  pgdata:
