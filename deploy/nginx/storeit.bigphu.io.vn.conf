# nginx trên host của VPS: lo HTTPS cho storeit.bigphu.io.vn rồi chuyển mọi request
# vào container web (127.0.0.1:${WEB_PORT}, mặc định 8080). Container web tự phục vụ
# SPA và proxy /api, nên ở đây chỉ cần một location.
#
# Cài (Ubuntu 24.04, nginx 1.24):
#   sudo apt install -y nginx certbot
#   # site mặc định của nginx đang phục vụ /var/www/html ở cổng 80: dùng nó lấy cert lần đầu
#   sudo certbot certonly --webroot -w /var/www/html -d storeit.bigphu.io.vn \
#     --deploy-hook "systemctl reload nginx"
#   sudo cp deploy/nginx/storeit.bigphu.io.vn.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/storeit.bigphu.io.vn.conf /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# certbot.timer tự gia hạn qua cùng webroot /var/www/html (khối cổng 80 bên dưới) và
# reload nginx sau khi có cert mới.

# Cổng 80: chỉ trả lời thử thách ACME của Let's Encrypt, còn lại chuyển sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name storeit.bigphu.io.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 của Ubuntu 24.04 chưa có "http2 on;" (từ 1.25.1) nên bật trên listen
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name storeit.bigphu.io.vn;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/storeit.bigphu.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storeit.bigphu.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Chỉ domain này, không includeSubDomains: các subdomain khác của bigphu.io.vn
    # không bị ép HTTPS theo
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Khớp giới hạn body của /api trong container web
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ghi đè (không nối) X-Forwarded-For bằng IP thật của kết nối: đây là hop đầu
        # tiên nên header client tự gửi lên bị bỏ. Container web nối thêm hop của nó,
        # app đọc từ phải sang trái qua HTTP_TRUSTED_PROXIES
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
